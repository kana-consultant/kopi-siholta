<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A3C"/>
      <stop offset="100%" stop-color="#4A2C2A"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C4956A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4956A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C4956A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#FAF7F2"/>
  <!-- Steam -->
  <path d="M22 20 Q24 14 22 8" stroke="url(#steamGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 18 Q34 12 32 6" stroke="url(#steamGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M42 20 Q44 14 42 8" stroke="url(#steamGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Coffee cup body -->
  <path d="M16 24 L18 52 Q18 56 22 56 L42 56 Q46 56 46 52 L48 24 Z" fill="url(#cupGrad)"/>
  <!-- Cup handle -->
  <path d="M46 28 Q54 28 54 36 Q54 44 46 44" stroke="#4A2C2A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cup rim highlight -->
  <ellipse cx="32" cy="24" rx="16" ry="4" fill="#C4956A"/>
  <!-- Coffee liquid -->
  <ellipse cx="32" cy="25" rx="13" ry="3" fill="#2C1810"/>
  <!-- Handle shadow -->
  <path d="M46 30 Q52 30 52 36 Q52 42 46 42" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
